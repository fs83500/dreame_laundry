name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 0.1.4)"
        required: true
      notes:
        description: "Notes de version (une ligne)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Tag + Release + archive
    runs-on: ubuntu-latest
    env:
      # inputs passed through the environment, never pasted into the scripts
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Cohérence version manifest vs saisie
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version invalide « $VERSION » (format attendu X.Y.Z)"
            exit 1
          fi
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/dreame_laundry/manifest.json'))['version'])")
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::manifest=$MANIFEST mais version saisie=$VERSION — mets à jour manifest.json d'abord"
            exit 1
          fi

      - name: Archive d'installation (custom_components uniquement)
        run: |
          cd custom_components
          zip -r "../dreame_laundry-$VERSION.zip" dreame_laundry -x '*__pycache__*'
          cd ..
          sha256sum "dreame_laundry-$VERSION.zip" > "dreame_laundry-$VERSION.zip.sha256"

      - name: Tag + Release GitHub
        run: |
          TAG="v$VERSION"
          # tag (idempotent : ne le recrée pas s'il existe déjà)
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          TITLE="Dreame Laundry v$VERSION"
          if [ -n "$NOTES" ]; then TITLE="$TITLE — $NOTES"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release déjà publiée : on remplace seulement les archives
            gh release upload "$TAG" --clobber \
              "dreame_laundry-$VERSION.zip" "dreame_laundry-$VERSION.zip.sha256"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Voir [AVANCEMENT.md](https://github.com/fs83500/dreame_laundry/blob/main/AVANCEMENT.md) pour le détail." \
              "dreame_laundry-$VERSION.zip" \
              "dreame_laundry-$VERSION.zip.sha256"
          fi
