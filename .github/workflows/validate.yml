name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: domain not in home-assistant/brands; description/topics: set on the GitHub repo page
          ignore: brands description topics

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component paho-mqtt pycryptodome ruff
      - run: ruff check --exclude custom_components/dreame_laundry/cloud .
      - run: pytest -q
      - name: Job summary on failure
        if: failure()
        run: pytest -q 2>&1 | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
