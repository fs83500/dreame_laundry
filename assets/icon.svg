<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <clipPath id="bodyclip"><rect x="24" y="12" width="208" height="232" rx="36"/></clipPath>
    <clipPath id="drum"><circle cx="128" cy="152" r="58"/></clipPath>
  </defs>
  <!-- body -->
  <rect x="24" y="12" width="208" height="232" rx="36" fill="url(#body)"/>
  <!-- control panel -->
  <rect x="24" y="12" width="208" height="52" fill="#1E3A8A" opacity="0.35" clip-path="url(#bodyclip)"/>
  <rect x="44" y="30" width="72" height="16" rx="8" fill="#DBEAFE"/>
  <circle cx="176" cy="38" r="10" fill="#DBEAFE"/>
  <circle cx="206" cy="38" r="10" fill="#DBEAFE"/>
  <!-- door -->
  <circle cx="128" cy="152" r="76" fill="#E0F2FE"/>
  <circle cx="128" cy="152" r="66" fill="#1E3A8A"/>
  <circle cx="128" cy="152" r="58" fill="#F0F9FF"/>
  <!-- water -->
  <g clip-path="url(#drum)">
    <path d="M60 160 C 84 140, 108 180, 132 160 S 180 140, 200 160 L 200 220 L 60 220 Z" fill="url(#water)"/>
  </g>
  <!-- highlight -->
  <path d="M96 118 A 44 44 0 0 1 140 106" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
